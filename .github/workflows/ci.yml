name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install commitizen

      - name: Check commit messages
        run: |
          cz check --rev-range origin/${{ github.base_ref }}..HEAD

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest --cov=moderato --cov-report=xml -v
        env:
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  wheel-smoke:
    name: Wheel Install & Import Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3

      - name: Build package
        run: poetry build

      - name: Verify py.typed and Lua scripts ship in the wheel
        run: |
          unzip -l dist/*.whl | grep 'moderato/py.typed'
          unzip -l dist/*.whl | grep 'moderato/scripts/fixed_window.lua'
          unzip -l dist/*.whl | grep 'moderato/scripts/token_bucket.lua'
          unzip -l dist/*.whl | grep 'moderato/scripts/sliding_window.lua'

      - name: Install wheel in a clean venv (no extras)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/pip check

      - name: Core import must work without optional dependencies
        run: |
          /tmp/smoke/bin/python -c "
          import moderato
          assert moderato.RateLimiter is not None
          assert moderato.RateLimitHeadersMiddleware is None
          assert not hasattr(moderato, 'RateLimitMetrics')
          try:
              moderato.RateLimiter(enable_metrics=True)
          except moderato.RateLimitConfigError as exc:
              assert 'moderato[metrics]' in str(exc)
          else:
              raise AssertionError('metrics must require the metrics extra')
          print('clean-env core import: OK')
          "

      - name: Reinstall with [all] extra and verify full surface
        run: |
          /tmp/smoke/bin/pip install -q "moderato[all] @ file://$(pwd)/$(ls dist/*.whl)" --force-reinstall
          /tmp/smoke/bin/python -c "
          import moderato
          from prometheus_client import generate_latest
          assert moderato.RateLimitHeadersMiddleware is not None
          assert moderato.RateLimitMetrics is not None
          first = moderato.RateLimiter(enable_metrics=True)
          second = moderato.RateLimiter(enable_metrics=True)
          assert first.metrics is second.metrics
          first.metrics.record_check('fixed_window', True)
          assert b'moderato_checks_total' in generate_latest()
          print('clean-env [all] import: OK')
          "

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run ruff
        run: poetry run ruff check .

      - name: Run black check
        run: poetry run black --check .

      - name: Run mypy
        run: poetry run mypy moderato --ignore-missing-imports
