name: Bug report
description: Report a problem with Moderato
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the expected behavior and what actually happened.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A short code snippet or script that reproduces the issue.
      placeholder: |
        from moderato import RateLimiter
        ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Moderato version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: redis-version
    attributes:
      label: Redis version and deployment
      description: e.g. Redis 7.2 standalone, Redis Cluster, managed Redis (Upstash, ElastiCache, ...)
      placeholder: "Redis 7.2 standalone"
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: How do you use Moderato?
      options:
        - RateLimiter / check() directly
        - FastAPI decorator
        - Starlette/FastAPI middleware
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
