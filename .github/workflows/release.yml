name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for PyPI Trusted Publishing (OIDC). No PYPI_TOKEN secret needed.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build package
        run: poetry build

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Extract changelog section for this version (matches both
          # commitizen's "## v0.3.0 (date)" and Keep-a-Changelog's
          # "## [0.3.0] - date" header formats)
          awk '/^## \[?v?'"$VERSION"'\]?/{flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > release_notes.md

          # If empty, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release $VERSION" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

      - name: Publish to PyPI (Trusted Publishing)
        # dc37677b2e1c63e2034f94d8a5b11f265b73ba33 = release/v1 (pinned for supply-chain hygiene)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          # PyPI versions are immutable; skip files already uploaded so a
          # retried run (e.g. after fixing publisher setup) can complete.
          skip-existing: true
