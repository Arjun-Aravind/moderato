services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - moderato-network

  app:
    image: moderato-demo:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
    networks:
      - moderato-network
    restart: unless-stopped

  multi-tenant:
    image: moderato-demo:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
      PORT: 8001
    command: ["sh", "-c", "exec uvicorn examples.multi_tenant:app --host 0.0.0.0 --port \"$${PORT}\""]
    networks:
      - moderato-network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - moderato-network
    profiles:
      - debug

  # Tests FLUSHDB: never point them at the examples' persistent Redis.
  redis-tests:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - moderato-network
    profiles:
      - test

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    depends_on:
      redis-tests:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis-tests:6379
      PYTHONUNBUFFERED: 1
    healthcheck:
      disable: true
    networks:
      - moderato-network
    profiles:
      - test

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
      target: benchmark
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
    healthcheck:
      disable: true
    networks:
      - moderato-network
    profiles:
      - benchmark

networks:
  moderato-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
