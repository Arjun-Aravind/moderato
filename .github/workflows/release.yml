name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for PyPI Trusted Publishing (OIDC). No PYPI_TOKEN secret needed.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release versions and changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text())["tool"]
          version = config["poetry"]["version"]
          runtime = next(
              ast.literal_eval(node.value)
              for node in ast.parse(Path("moderato/__init__.py").read_text()).body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          )
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Tag/package version mismatch"
          assert runtime == config["commitizen"]["version"] == version, "Version mismatch"
          heading = re.compile(r"^## (?:\[" + re.escape(version) + r"\]|v?"
                               + re.escape(version) + r")(?=\s|$).*$", re.MULTILINE)
          changelog = Path("CHANGELOG.md").read_text()
          match = heading.search(changelog)
          assert match, f"Missing changelog section for {version}"
          assert "unreleased" not in match.group().lower(), "Finalize changelog before release"
          notes = re.split(r"^## ", changelog[match.end():], maxsplit=1, flags=re.MULTILINE)[0].strip()
          assert notes, "Empty changelog section"
          Path("release_notes.md").write_text(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3

      - name: Build package
        run: poetry build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

      - name: Publish to PyPI (Trusted Publishing)
        # dc37677b2e1c63e2034f94d8a5b11f265b73ba33 = release/v1 (pinned for supply-chain hygiene)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          # PyPI versions are immutable; skip files already uploaded so a
          # retried run (e.g. after fixing publisher setup) can complete.
          skip-existing: true
